
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>PTK — The Chain Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --black:#050505;
 --white:#f6f6f3;
 --muted:#888;
 --line:rgba(255,255,255,.18);
 --glass:rgba(255,255,255,.055);
 --ease:cubic-bezier(.19,1,.22,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 background:var(--black);
 color:var(--white);
 font-family:"DM Sans",sans-serif;
 transition:background 1.3s var(--ease),color 1.3s var(--ease);
}
body.light{background:#f0efeb;color:#111}
button{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
#scene{
 position:fixed;inset:0;width:100%;height:100%;
 z-index:0;pointer-events:none;
}
#grain{
 position:fixed;inset:-50%;z-index:40;pointer-events:none;
 opacity:.045;
 background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
 animation:grain .25s steps(2) infinite;
}
@keyframes grain{
 0%{transform:translate(0,0)}
 25%{transform:translate(2%,-1%)}
 50%{transform:translate(-1%,2%)}
 75%{transform:translate(1%,1%)}
 100%{transform:translate(-2%,-1%)}
}
#app{position:relative;width:100%;height:100%;z-index:2;overflow:hidden}
.topbar{
 position:fixed;z-index:30;left:0;top:0;width:100%;
 padding:26px 4.5vw;
 display:flex;align-items:center;justify-content:space-between;
 pointer-events:none;
}
.logo{
 font:800 12px Manrope,sans-serif;
 letter-spacing:.25em;text-transform:uppercase;
}
.logo span{font-weight:400;opacity:.42}
.top-info{
 display:flex;align-items:center;gap:25px;
 font-size:9px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--muted);
}
.top-info a{color:inherit;text-decoration:none;pointer-events:auto}
.top-info a:hover{color:var(--white)}
.hero{
 position:absolute;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 text-align:center;
 transition:opacity 1s var(--ease),transform 1.2s var(--ease);
}
.hero.out{opacity:0;pointer-events:none;transform:scale(1.08)}
.hero-inner{position:relative;z-index:3;padding:25px}
.hero-kicker{
 font-size:9px;letter-spacing:.38em;text-transform:uppercase;
 color:var(--muted);margin-bottom:30px;
}
.hero-title{
 font:800 clamp(75px,15vw,205px)/.78 Manrope,sans-serif;
 letter-spacing:-.115em;margin:0;
}
.hero-title span{display:block}
.hero-title span:last-child{
 font-size:.46em;letter-spacing:.16em;
 font-weight:400;margin-top:28px;
}
.hero-line{
 width:50px;height:1px;background:currentColor;
 opacity:.35;margin:38px auto 22px;
}
.hero-description{
 font:300 clamp(11px,1.2vw,15px) Manrope;
 letter-spacing:.2em;text-transform:uppercase;opacity:.65;
}
.enter{
 margin-top:42px;border:1px solid var(--line);
 background:transparent;color:inherit;
 padding:16px 28px;border-radius:50px;
 font-size:9px;letter-spacing:.24em;text-transform:uppercase;
 cursor:pointer;transition:.4s var(--ease);
}
.enter:hover{background:var(--white);color:#050505;transform:translateY(-4px)}
.hero-foot{
 position:absolute;bottom:6vh;left:0;width:100%;
 display:flex;align-items:center;justify-content:center;gap:13px;
 color:var(--muted);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
}
.scroll-symbol{
 width:16px;height:25px;border:1px solid currentColor;
 border-radius:12px;position:relative;
}
.scroll-symbol:after{
 content:"";position:absolute;left:6px;top:5px;width:2px;height:5px;
 border-radius:4px;background:currentColor;
 animation:scrollDot 1.5s infinite;
}
@keyframes scrollDot{
 0%{transform:translateY(0);opacity:1}
 100%{transform:translateY(8px);opacity:0}
}
.archive{
 position:absolute;inset:0;z-index:3;
 opacity:0;pointer-events:none;
 transition:opacity .9s var(--ease);
}
.archive.active{opacity:1;pointer-events:auto}
.year-stage{
 position:absolute;inset:0;overflow:hidden;
}
.year-content{
 position:absolute;inset:0;
 opacity:0;pointer-events:none;
 transition:opacity .75s var(--ease),transform 1s var(--ease);
 transform:translateY(18px);
}
.year-content.active{
 opacity:1;pointer-events:auto;transform:translateY(0);
}
.year-top{
 position:absolute;left:7vw;top:14vh;z-index:8;
 max-width:440px;pointer-events:none;
}
.year-index{
 font-size:9px;letter-spacing:.35em;text-transform:uppercase;
 color:var(--muted);margin-bottom:16px;
}
.year-number{
 font:800 clamp(70px,11vw,145px)/.83 Manrope,sans-serif;
 letter-spacing:-.105em;margin:0;
}
.year-heading{
 font:500 clamp(18px,2.3vw,31px)/1.15 Manrope;
 letter-spacing:-.045em;margin:19px 0 10px;
}
.year-description{
 max-width:390px;color:var(--muted);
 font-size:12px;line-height:1.8;
}
.chain-caption{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 font:500 9px Manrope;letter-spacing:.24em;
 text-transform:uppercase;white-space:nowrap;
 opacity:.3;pointer-events:none;
}
.chain-guide{
 position:absolute;left:0;right:0;top:50%;
 height:1px;background:var(--line);opacity:.2;
}
.event-layer{
 position:absolute;inset:0;z-index:10;
 pointer-events:none;
}
.event-pin{
 position:absolute;left:0;top:0;
 transform:translate(-50%,-50%);
 pointer-events:auto;
 border:0;background:transparent;color:inherit;
 cursor:pointer;padding:0;
 width:1px;height:1px;
}
.pin-core{
 position:absolute;left:0;top:0;
 width:13px;height:13px;border-radius:50%;
 transform:translate(-50%,-50%);
 border:1px solid currentColor;
 background:var(--white);
 box-shadow:0 0 18px rgba(255,255,255,.5);
 transition:transform .35s var(--ease),box-shadow .35s;
}
body.light .pin-core{background:#111;box-shadow:0 0 18px rgba(0,0,0,.3)}
.pin-ring{
 position:absolute;left:0;top:0;width:29px;height:29px;
 border:1px solid currentColor;border-radius:50%;
 opacity:.4;transform:translate(-50%,-50%);
 transition:transform .5s var(--ease),opacity .5s;
}
.event-pin:hover .pin-ring{transform:translate(-50%,-50%) scale(1.55);opacity:.9}
.event-pin:hover .pin-core{transform:translate(-50%,-50%) scale(1.5)}
.pin-label{
 position:absolute;left:0;
 width:max-content;max-width:210px;
 transform:translateX(-50%);
 text-align:center;
 padding:0 8px;
 pointer-events:none;
}
.event-pin.up .pin-label{bottom:23px}
.event-pin.down .pin-label{top:23px}
.pin-title{
 display:block;font:600 11px Manrope;
 letter-spacing:-.015em;
 text-shadow:0 2px 15px rgba(0,0,0,.4);
}
.pin-type{
 display:block;margin-top:5px;
 font-size:8px;letter-spacing:.17em;text-transform:uppercase;
 color:var(--muted);
}
.event-pin:hover .pin-title{letter-spacing:.02em}
.year-bottom{
 position:absolute;left:7vw;bottom:8vh;z-index:12;
 display:flex;align-items:center;gap:16px;
 font-size:9px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--muted);pointer-events:none;
}
.bottom-line{width:35px;height:1px;background:currentColor}
.event-count{
 position:absolute;right:7vw;bottom:8vh;z-index:12;
 font:500 10px Manrope;letter-spacing:.15em;color:var(--muted);
}
.navigation{
 position:fixed;z-index:30;right:4.5vw;bottom:5vh;
 display:flex;align-items:center;gap:9px;
}
.nav-button{
 width:43px;height:43px;border:1px solid var(--line);
 border-radius:50%;background:transparent;color:inherit;
 cursor:pointer;font-size:17px;transition:.35s;
}
.nav-button:hover{background:var(--white);color:#050505}
.nav-number{
 min-width:75px;text-align:center;
 font:500 10px Manrope;letter-spacing:.15em;color:var(--muted);
}
.year-selector{
 position:fixed;z-index:30;left:4.5vw;bottom:5vh;
 display:flex;align-items:center;gap:9px;
 max-width:48vw;overflow-x:auto;scrollbar-width:none;
}
.year-selector::-webkit-scrollbar{display:none}
.year-select{
 flex:none;border:0;background:transparent;color:var(--muted);
 font:500 10px Manrope;padding:8px 2px;cursor:pointer;
 opacity:.55;transition:.3s;
}
.year-select.active{opacity:1;color:inherit}
.year-select:after{
 content:"";display:block;height:1px;background:currentColor;
 margin-top:6px;transform:scaleX(0);transition:.3s;
}
.year-select.active:after{transform:scaleX(1)}
.progress{
 position:fixed;z-index:31;bottom:0;left:0;width:100%;
 height:2px;background:var(--line);
}
.progress span{
 display:block;width:0;height:100%;
 background:currentColor;transition:width .15s linear;
}
.scroll-hint{
 position:fixed;z-index:30;right:22px;top:50%;
 writing-mode:vertical-rl;transform:translateY(-50%);
 color:var(--muted);font-size:8px;letter-spacing:.22em;
 text-transform:uppercase;opacity:.7;pointer-events:none;
}
.detail-overlay{
 position:fixed;z-index:60;inset:0;
 display:flex;align-items:center;justify-content:center;
 padding:20px;background:rgba(0,0,0,.56);
 backdrop-filter:blur(22px);
 opacity:0;pointer-events:none;transition:opacity .5s;
}
.detail-overlay.open{opacity:1;pointer-events:auto}
.detail-panel{
 width:min(760px,100%);max-height:88vh;overflow-y:auto;
 background:#0c0c0d;color:#f7f7f7;
 border:1px solid rgba(255,255,255,.16);
 border-radius:22px;padding:clamp(25px,5vw,58px);
 transform:translateY(25px) scale(.985);
 transition:transform .6s var(--ease);
 box-shadow:0 35px 120px rgba(0,0,0,.5);
}
.detail-overlay.open .detail-panel{transform:translateY(0) scale(1)}
.detail-top{display:flex;justify-content:space-between;align-items:center}
.detail-label{
 font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#888;
}
.detail-close{
 width:38px;height:38px;border:1px solid #333;border-radius:50%;
 background:transparent;color:#fff;font-size:20px;cursor:pointer;
}
.detail-year{
 margin-top:35px;font:500 10px Manrope;letter-spacing:.2em;color:#999;
}
.detail-title{
 font:800 clamp(32px,7vw,68px)/.98 Manrope;
 letter-spacing:-.075em;margin:14px 0 25px;
}
.detail-description{
 color:#aaa;font-size:14px;line-height:1.9;max-width:590px;
}
.detail-cover{
 width:100%;aspect-ratio:16/7;margin:28px 0;
 border:1px solid #303030;border-radius:12px;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 background:
 radial-gradient(circle at 70% 30%,rgba(255,255,255,.17),transparent 30%),
 linear-gradient(130deg,#080808,#222,#080808);
}
.detail-cover span{
 font:800 clamp(24px,7vw,65px) Manrope;
 letter-spacing:-.08em;text-align:center;
}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:25px}
.detail-tag{
 border:1px solid #303030;border-radius:30px;
 padding:9px 12px;font-size:9px;letter-spacing:.12em;
 text-transform:uppercase;color:#aaa;
}
.detail-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.detail-action{
 color:white;text-decoration:none;
 border-bottom:1px solid #555;padding:8px 0;
 font-size:10px;letter-spacing:.16em;text-transform:uppercase;
}
.detail-action:hover{border-color:white}
.detail-note{font-size:10px;color:#777;line-height:1.7;margin-top:25px}
.end-screen{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;text-align:center;
 opacity:0;pointer-events:none;transition:opacity .7s;
}
.end-screen.active{opacity:1;pointer-events:auto}
.end-title{
 font:800 clamp(55px,12vw,150px)/.86 Manrope;
 letter-spacing:-.1em;margin:0;
}
.end-sub{
 font-size:9px;letter-spacing:.3em;text-transform:uppercase;
 color:var(--muted);margin-top:30px;
}
@media(max-width:700px){
 .topbar{padding:20px 6vw}
 .top-info{display:none}
 .hero-title{font-size:clamp(80px,21vw,145px)}
 .year-top{left:7vw;top:12vh;max-width:86vw}
 .year-number{font-size:clamp(76px,19vw,125px)}
 .year-heading{font-size:22px;margin:12px 0 7px}
 .year-description{font-size:11px;max-width:310px}
 .pin-label{max-width:125px}
 .pin-title{font-size:9px}
 .pin-type{font-size:7px}
 .year-bottom{left:7vw;bottom:12vh;font-size:8px}
 .event-count{right:7vw;bottom:12vh}
 .navigation{right:6vw;bottom:4vh;gap:5px}
 .nav-button{width:37px;height:37px}
 .nav-number{min-width:52px;font-size:9px}
 .year-selector{left:6vw;bottom:4vh;max-width:43vw;gap:7px}
 .year-select{font-size:9px}
 .scroll-hint{display:none}
 .detail-panel{border-radius:17px}
 .detail-description{font-size:12px}
}
@media(max-height:650px) and (min-width:701px){
 .year-top{top:10vh}
 .year-number{font-size:90px}
 .year-heading{font-size:22px}
 .year-description{font-size:11px}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="grain"></div>

<div id="app">
<header class="topbar">
 <div class="logo">PTK <span> / THE CHAIN ARCHIVE</span></div>
 <div class="top-info">
  <span>Independent digital archive</span>
  <span>2013 — 2026</span>
 </div>
</header>

<section class="hero" id="hero">
 <div class="hero-inner">
  <div class="hero-kicker">A visual history of PTK</div>
  <h1 class="hero-title"><span>PTK</span><span>THE CHAIN</span></h1>
  <div class="hero-line"></div>
  <div class="hero-description">Every link has a story.</div>
  <button class="enter" id="enter">Explore the archive&nbsp; ↗</button>
 </div>
 <div class="hero-foot">
  <span class="scroll-symbol"></span>
  <span>Scroll to travel through time</span>
 </div>
</section>

<main class="archive" id="archive">
 <div class="year-stage" id="yearStage"></div>
 <div class="end-screen" id="endScreen">
  <div>
   <div class="hero-kicker">The chain continues</div>
   <h2 class="end-title">NOT THE<br>END.</h2>
   <div class="end-sub">PTK — The Chain Archive</div>
  </div>
 </div>
</main>

<div class="scroll-hint">Scroll / Swipe to travel through time</div>
<div class="year-selector" id="yearSelector"></div>
<div class="navigation">
 <button class="nav-button" id="previous" aria-label="Previous year">←</button>
 <span class="nav-number" id="navNumber">2013 / 2026</span>
 <button class="nav-button" id="next" aria-label="Next year">→</button>
</div>
<div class="progress"><span id="progressBar"></span></div>

<div class="detail-overlay" id="detailOverlay">
 <article class="detail-panel">
  <div class="detail-top">
   <div class="detail-label">PTK / ARCHIVE ENTRY</div>
   <button class="detail-close" id="detailClose" aria-label="Close">×</button>
  </div>
  <div class="detail-year" id="detailYear"></div>
  <h2 class="detail-title" id="detailTitle"></h2>
  <p class="detail-description" id="detailDescription"></p>
  <div class="detail-cover" id="detailCover"><span>PTK</span></div>
  <div class="detail-tags" id="detailTags"></div>
  <div class="detail-actions" id="detailActions"></div>
  <div class="detail-note" id="detailNote"></div>
 </article>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

/* ---------------------------------------------------------
   DOM / CHAPTER GENERATION
   --------------------------------------------------------- */

const stage=document.getElementById("yearStage");
const selector=document.getElementById("yearSelector");
const overlay=document.getElementById("detailOverlay");
const detailTitle=document.getElementById("detailTitle");
const detailYear=document.getElementById("detailYear");
const detailDescription=document.getElementById("detailDescription");
const detailTags=document.getElementById("detailTags");
const detailActions=document.getElementById("detailActions");
const detailCover=document.getElementById("detailCover");
const detailNote=document.getElementById("detailNote");

let activeYear=0;
let targetProgress=0;
let cameraProgress=0;
let dragging=false;
let dragStart=0;
let dragOrigin=0;
let lastTouchX=0;
let chainPins=[];
let chapterElements=[];
let yearButtons=[];

function makeChapter(data,index){
 const section=document.createElement("section");
 section.className="year-content";
 section.dataset.index=index;
 section.innerHTML=`
  <div class="year-top">
   <div class="year-index">${data.chapter} / PTK ARCHIVE</div>
   <h2 class="year-number">${data.year}</h2>
   <div class="year-heading">${data.title}</div>
   <p class="year-description">${data.description}</p>
  </div>
  <div class="chain-guide"></div>
  <div class="chain-caption">THE CHAIN CONNECTS EVERY MOMENT</div>
  <div class="event-layer"></div>
  <div class="year-bottom"><span class="bottom-line"></span><span>${data.subtitle}</span></div>
  <div class="event-count">${String(data.events.length).padStart(2,"0")} ARCHIVE ENTRIES</div>
 `;
 stage.appendChild(section);
 chapterElements.push(section);

 const button=document.createElement("button");
 button.className="year-select";
 button.textContent=data.year;
 button.addEventListener("click",()=>goTo(index));
 selector.appendChild(button);
 yearButtons.push(button);
}
archiveData.forEach(makeChapter);

function buildPins(){
 chainPins=[];
 archiveData.forEach((year,yearIndex)=>{
  const section=chapterElements[yearIndex];
  const layer=section.querySelector(".event-layer");
  year.events.forEach((event,eventIndex)=>{
   const pin=document.createElement("button");
   pin.className="event-pin "+(eventIndex%2===0?"up":"down");
   pin.setAttribute("aria-label",event.title);
   pin.innerHTML=`
    <span class="pin-ring"></span>
    <span class="pin-core"></span>
    <span class="pin-label">
     <span class="pin-title">${event.title}</span>
     <span class="pin-type">${event.type}</span>
    </span>
   `;
   pin.addEventListener("click",()=>openDetail(yearIndex,eventIndex));
   layer.appendChild(pin);
   chainPins.push({element:pin,yearIndex,eventIndex});
  });
 });
}
buildPins();

/* ---------------------------------------------------------
   NAVIGATION
   --------------------------------------------------------- */

const hero=document.getElementById("hero");
const archive=document.getElementById("archive");
const endScreen=document.getElementById("endScreen");
const navNumber=document.getElementById("navNumber");
const progressBar=document.getElementById("progressBar");

function goTo(index){
 activeYear=Math.max(0,Math.min(archiveData.length,index));
 targetProgress=activeYear;
 updateInterface();
}
function updateInterface(){
 const atEnd=activeYear>=archiveData.length;
 chapterElements.forEach((el,i)=>el.classList.toggle("active",i===activeYear));
 yearButtons.forEach((el,i)=>el.classList.toggle("active",i===activeYear));
 endScreen.classList.toggle("active",atEnd);
 navNumber.textContent=atEnd?"END / END":`${archiveData[activeYear].year} / 2026`;
 document.body.classList.toggle("light",!atEnd && activeYear%2===1);
 progressBar.style.width=`${activeYear/archiveData.length*100}%`;
}
document.getElementById("enter").addEventListener("click",()=>{
 hero.classList.add("out");
 archive.classList.add("active");
 goTo(0);
});
document.getElementById("next").addEventListener("click",()=>goTo(activeYear+1));
document.getElementById("previous").addEventListener("click",()=>goTo(activeYear-1));

window.addEventListener("keydown",e=>{
 if(overlay.classList.contains("open")){
  if(e.key==="Escape")closeDetail();
  return;
 }
 if(e.key==="ArrowRight"||e.key===" "){
  e.preventDefault();
  if(archive.classList.contains("active"))goTo(activeYear+1);
 }
 if(e.key==="ArrowLeft"){
  if(archive.classList.contains("active"))goTo(activeYear-1);
 }
 if(e.key==="Escape"){
  hero.classList.remove("out");
  archive.classList.remove("active");
 }
});

/* Wheel and trackpad */
window.addEventListener("wheel",e=>{
 if(!archive.classList.contains("active"))return;
 if(overlay.classList.contains("open"))return;
 e.preventDefault();
 let amount=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
 targetProgress=Math.max(0,Math.min(archiveData.length,targetProgress+amount*.0017));
 activeYear=Math.max(0,Math.min(archiveData.length,Math.round(targetProgress)));
 updateInterface();
},{passive:false});

/* Touch swipe */
window.addEventListener("touchstart",e=>{
 lastTouchX=e.touches[0].clientX;
},{passive:true});
window.addEventListener("touchend",e=>{
 if(!archive.classList.contains("active"))return;
 if(overlay.classList.contains("open"))return;
 const delta=lastTouchX-e.changedTouches[0].clientX;
 if(Math.abs(delta)>45)goTo(activeYear+(delta>0?1:-1));
},{passive:true});

/* Smooth animation loop */
function animationLoop(){
 cameraProgress+=(targetProgress-cameraProgress)*.075;
 if(Math.abs(targetProgress-cameraProgress)<.0005)cameraProgress=targetProgress;
 requestAnimationFrame(animationLoop);
 update3DCamera();
 updatePinPositions();
}
requestAnimationFrame(animationLoop);

function openDetail(yearIndex,eventIndex){
 const year=archiveData[yearIndex];
 const event=year.events[eventIndex];
 detailYear.textContent=`${year.year} / ${event.type}`;
 detailTitle.textContent=event.title;
 detailDescription.textContent=event.description;
 detailTags.innerHTML=event.tags.map(tag=>`<span class="detail-tag">${tag}</span>`).join("");
 detailActions.innerHTML="";
 if(event.link){
  const a=document.createElement("a");
  a.className="detail-action";
  a.href=event.link;
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.textContent=event.linkLabel||"Explore ↗";
  detailActions.appendChild(a);
 }
 if(event.video){
  const a=document.createElement("a");
  a.className="detail-action";
  a.href="https://www.youtube.com/watch?v="+event.video;
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.textContent="Watch video ↗";
  detailActions.appendChild(a);
 }
 detailCover.innerHTML=`<span>${event.cover||"PTK"}</span>`;
 detailNote.textContent=event.note||"Archivní záznam. Přesná data a původní materiály se mohou lišit podle dostupných zdrojů.";
 overlay.classList.add("open");
}
function closeDetail(){overlay.classList.remove("open")}
document.getElementById("detailClose").addEventListener("click",closeDetail);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeDetail()});

/* ---------------------------------------------------------
   THREE.JS — REAL 3D CHAIN
   --------------------------------------------------------- */

let scene,camera,renderer,chainGroup,chainLinks,yearMarkers;
let chainLength=archiveData.length*9.5;
let pinObjects=[];
let mouseX=0,mouseY=0;
let clockStart=performance.now();

function makeEnvironment(){
 const canvas=document.createElement("canvas");
 canvas.width=1024;canvas.height=512;
 const ctx=canvas.getContext("2d");
 const gradient=ctx.createLinearGradient(0,0,0,512);
 gradient.addColorStop(0,"#b8c2d1");
 gradient.addColorStop(.25,"#30343c");
 gradient.addColorStop(.5,"#111318");
 gradient.addColorStop(.75,"#555b65");
 gradient.addColorStop(1,"#a9afb9");
 ctx.fillStyle=gradient;ctx.fillRect(0,0,1024,512);
 for(let i=0;i<14;i++){
  const x=i*78;
  const g=ctx.createLinearGradient(x,0,x+30,0);
  g.addColorStop(0,"rgba(255,255,255,0)");
  g.addColorStop(.5,"rgba(255,255,255,.9)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g;ctx.fillRect(x,0,35,512);
 }
 const texture=new THREE.CanvasTexture(canvas);
 texture.mapping=THREE.EquirectangularReflectionMapping;
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

function init3D(){
 const canvas=document.getElementById("scene");
 if(!window.THREE)return;
 scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(38,window.innerWidth/window.innerHeight,.1,500);
 camera.position.set(0,0,17);
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.35;

 const env=makeEnvironment();
 scene.environment=env;

 scene.add(new THREE.AmbientLight(0xffffff,.75));
 const key=new THREE.DirectionalLight(0xffffff,4.5);
 key.position.set(-4,8,10);scene.add(key);
 const rim=new THREE.DirectionalLight(0xa8c7ff,3.2);
 rim.position.set(5,-4,7);scene.add(rim);
 const strip=new THREE.PointLight(0xffffff,45,100);
 strip.position.set(0,7,8);scene.add(strip);
 const lower=new THREE.PointLight(0x9cb9df,25,80);
 lower.position.set(0,-7,4);scene.add(lower);

 chainGroup=new THREE.Group();
 scene.add(chainGroup);

 const silver=new THREE.MeshPhysicalMaterial({
  color:0xe2e5ea,
  metalness:1,
  roughness:.14,
  clearcoat:1,
  clearcoatRoughness:.08,
  envMapIntensity:1.7
 });
 const darkSilver=new THREE.MeshPhysicalMaterial({
  color:0x8e969f,
  metalness:1,
  roughness:.19,
  clearcoat:1,
  clearcoatRoughness:.1,
  envMapIntensity:1.5
 });
 const brightSilver=new THREE.MeshPhysicalMaterial({
  color:0xffffff,
  metalness:1,
  roughness:.09,
  clearcoat:1,
  clearcoatRoughness:.04,
  envMapIntensity:2
 });

 const linkGeometry=new THREE.TorusGeometry(.39,.125,24,64);
 const linkInner=new THREE.TorusGeometry(.39,.075,20,64);
 chainLinks=[];
 const spacing=.61;
 const linkCount=Math.ceil(chainLength/spacing)+12;

 for(let i=0;i<linkCount;i++){
  const holder=new THREE.Group();
  const mesh=new THREE.Mesh(linkGeometry,i%3===0?brightSilver:(i%2?silver:darkSilver));
  const inner=new THREE.Mesh(linkInner,i%2?darkSilver:silver);
  holder.add(mesh);
  holder.position.x=i*spacing-chainLength/2;
  holder.rotation.y=i%2===0?Math.PI/2:0;
  holder.rotation.x=i%2===0?.12:-.12;
  chainGroup.add(holder);
  chainLinks.push(holder);
 }
 chainGroup.position.y=-.1;

 /* Diamond-like anchor stones */
 yearMarkers=[];
 archiveData.forEach((year,i)=>{
  const group=new THREE.Group();
  const ring=new THREE.Mesh(
   new THREE.TorusGeometry(.72,.12,20,64),
   brightSilver
  );
  ring.rotation.y=Math.PI/2;
  group.add(ring);

  const stoneGeo=new THREE.OctahedronGeometry(.3,1);
  const stoneMat=new THREE.MeshPhysicalMaterial({
   color:0xffffff,metalness:.3,roughness:.05,
   transmission:.15,thickness:.6,clearcoat:1,
   emissive:0x303744,emissiveIntensity:.25
  });
  const stone=new THREE.Mesh(stoneGeo,stoneMat);
  stone.position.z=.48;
  group.add(stone);

  const x=(i*9.5)-chainLength/2+4.75;
  group.position.set(x,0,0);
  scene.add(group);
  yearMarkers.push(group);
 });

 /* Individual event nodes are placed along the physical chain. */
 pinObjects=[];
 archiveData.forEach((year,yearIndex)=>{
  year.events.forEach((event,eventIndex)=>{
   const count=year.events.length;
   const local=(eventIndex+1)/(count+1);
   const x=(yearIndex*9.5)-chainLength/2+local*9.5;
   const y=eventIndex%2===0?.0:.0;
   const z=eventIndex%2===0?.12:-.12;
   const gem=new THREE.Mesh(
    new THREE.OctahedronGeometry(.12,1),
    new THREE.MeshPhysicalMaterial({
     color:0xffffff,metalness:.35,roughness:.06,
     clearcoat:1,emissive:0x64758c,emissiveIntensity:.3
    })
   );
   gem.position.set(x,y,z);
   scene.add(gem);
   pinObjects.push({mesh:gem,yearIndex,eventIndex});
  });
 });

 /* Subtle floating dust */
 const dustGeo=new THREE.BufferGeometry();
 const dustCount=500;
 const dustPositions=new Float32Array(dustCount*3);
 for(let i=0;i<dustCount;i++){
  dustPositions[i*3]=(Math.random()-.5)*chainLength;
  dustPositions[i*3+1]=(Math.random()-.5)*14;
  dustPositions[i*3+2]=-4-Math.random()*12;
 }
 dustGeo.setAttribute("position",new THREE.BufferAttribute(dustPositions,3));
 const dust=new THREE.Points(
  dustGeo,
  new THREE.PointsMaterial({color:0xffffff,size:.025,transparent:true,opacity:.45})
 );
 scene.add(dust);

 window.addEventListener("mousemove",e=>{
  mouseX=(e.clientX/window.innerWidth-.5)*2;
  mouseY=(e.clientY/window.innerHeight-.5)*2;
 });
 window.addEventListener("resize",resize3D);
 render3D();
}

function resize3D(){
 if(!camera||!renderer)return;
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
}

function update3DCamera(){
 if(!camera)return;
 const index=Math.min(cameraProgress,archiveData.length-1);
 const x=(index*9.5)-chainLength/2+4.75;
 camera.position.x=x+mouseX*.45;
 camera.position.y=mouseY*.22;
 camera.position.z=17;
 camera.lookAt(x,0,0);
}

function render3D(){
 requestAnimationFrame(render3D);
 if(!renderer)return;
 const t=(performance.now()-clockStart)*.001;
 if(chainGroup){
  chainGroup.rotation.y=Math.sin(t*.25)*.035;
  chainLinks.forEach((link,i)=>{
   link.rotation.z=Math.sin(t*.6+i*.08)*.025;
  });
 }
 yearMarkers.forEach((marker,i)=>{
  marker.rotation.y=Math.PI/2+Math.sin(t*.5+i*.3)*.12;
  marker.rotation.x=Math.sin(t*.7+i*.5)*.08;
  marker.position.y=Math.sin(t*.8+i*.6)*.12;
 });
 pinObjects.forEach((p,i)=>{
  const scale=1+Math.sin(t*2+i*.7)*.12;
  p.mesh.scale.setScalar(scale);
  p.mesh.rotation.y=t*.35+i;
 });
 renderer.render(scene,camera);
}

/* ---------------------------------------------------------
   PROJECT 3D EVENT POSITIONS INTO THE SCREEN
   --------------------------------------------------------- */

const vector=new THREE.Vector3();
function updatePinPositions(){
 if(!camera)return;
 const width=window.innerWidth,height=window.innerHeight;
 chainPins.forEach(pin=>{
  const year=archiveData[pin.yearIndex];
  const eventIndex=pin.eventIndex;
  const local=(eventIndex+1)/(year.events.length+1);
  const worldX=(pin.yearIndex*9.5)-chainLength/2+local*9.5;
  const worldY=eventIndex%2===0?.95:-.95;
  vector.set(worldX,worldY,.1);
  vector.project(camera);
  const x=(vector.x*.5+.5)*width;
  const y=(-vector.y*.5+.5)*height;
  const visible=vector.z<1 && x>-100 && x<width+100;
  pin.element.style.transform=`translate(${x}px,${y}px)`;
  pin.element.style.opacity=visible?"1":"0";
  pin.element.style.pointerEvents=visible?"auto":"none";
 });
}

/* ---------------------------------------------------------
   INIT
   --------------------------------------------------------- */

init3D();
updateInterface();

/* Make the first screen the only visible thing before entry. */
document.body.classList.remove("light");
</script>
